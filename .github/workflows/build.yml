name: Build Contract

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.22'

    - name: Install TinyGo
      run: |
        wget https://github.com/tinygo-org/tinygo/releases/download/v0.31.0/tinygo_0.31.0_amd64.deb
        sudo dpkg -i tinygo_0.31.0_amd64.deb

    - name: Install near-go CLI
      run: |
        go install github.com/near/near-go/cmd/near-go@latest
        echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

    - name: Build contract
      run: |
        cd contract
        tinygo build -target wasi -gc=leaking -opt=0 -no-debug -o ../main.wasm .

    - name: Upload WASM Artifact
      uses: actions/upload-artifact@v3
      with:
        name: main.wasm
        path: main.wasm
